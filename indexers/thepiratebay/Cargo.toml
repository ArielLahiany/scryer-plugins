[package]
name = "thepiratebay-indexer"
version = "1.0.0"
edition = "2024"
autolib = false
license = "GPL-3.0-only"
description = "The Pirate Bay public torrent indexer using the apibay JSON API"

[package.metadata.scryer]
official = true
plugin_id = "thepiratebay"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.18.17"
feature_sets = [{ required_features = [] }, { required_features = ["simd128", "relaxed-simd"] }]
docs_url = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/thepiratebay"
source_repo = "https://github.com/scryer-media/scryer-plugins/tree/main/indexers/thepiratebay"

[[bin]]
name = "thepiratebay-indexer"
path = "src/lib.rs"

[dependencies]
indexer-command-compat = { path = "../command-compat" }
scryer-plugin-pdk = "0.5.10"
scryer-plugin-sdk = "3.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
